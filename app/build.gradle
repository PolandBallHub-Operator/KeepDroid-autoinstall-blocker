plugins { id 'com.android.application' }

android {
    namespace 'com.devtangle.manager'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'com.devtangle.manager'; minSdk 28; targetSdk 35; versionCode 3; versionName '1.2.0-freedroidwarn' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.android.tools.build:apksig:9.4.0'
    implementation 'com.github.apk-editor:aXML:d43b543'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation project(':freeDroidWarn')
}
